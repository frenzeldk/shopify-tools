# ─────────────────────────────────────────────────────────────────────────────
# Purchase-order ordering configuration
#
# ALL ordering config now lives in the database. Templates (email + API) are
# edited from the UI (gear menu → "Create/Edit ordering template"), keyed by the
# saved grid-view name; global `defaults` are stored in the DB too.
#
# This file is OPTIONAL. The `defaults` below act only as a fallback until they
# are migrated into the DB. To migrate an existing YAML file into the database:
#     python app.py migrate-ordering-config [path/to/orders.yaml]
# The schema below documents the API template shape for the raw editor.
#
# `method` chooses the backend:
#   email                   -> email_backend  (templated email + order XLSX)
#   api  + api.type=openapi -> api_backend    (authenticated REST / OpenAPI flow)
#   api  + api.type=graphql -> api_backend    (GraphQL queries + place mutation)
#
# Secrets are referenced as {$env: VAR}; {$ref: ...} pulls a runtime value,
# {$value: "..."} interpolates {order_number}/{company_name}/{address_id}, and
# {$items: {dest: source}} builds a list from the order lines.
# Override the file location with the PURCHASE_ORDER_CONFIG environment variable.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  company_name: XtraGrej
  order_number_prefix: WT

